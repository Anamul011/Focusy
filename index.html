<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Focusy</title>
  <style>
    :root {
      --bg: #f6f6fb;
      --card: #fff;
      --tx: #1b1b2b;
      --mut: #6b6b80;
      --bd: #e4e4ef;
      --acc: #5b4bff;
      --accs: #ecebff;
      --emg: #e5484d;
      --urg: #f76b15;
      --upc: #b88600;
      --safe: #2f9e6b;
      --done: #8b8d98;
      --sh: 0 6px 24px rgba(30, 30, 70, .07);
      color-scheme: light;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px)
    }

    @media(prefers-color-scheme:dark) {
      :root:not([data-theme="light"]) {
        --bg: #12121c;
        --card: #1c1c2b;
        --tx: #ececf6;
        --mut: #9a9ab3;
        --bd: #2c2c42;
        --acc: #8b7fff;
        --accs: #2a2750;
        --upc: #e0b020;
        --sh: 0 6px 24px rgba(0, 0, 0, .35);
        color-scheme: dark
      }
    }

    :root[data-theme="dark"] {
      --bg: #12121c;
      --card: #1c1c2b;
      --tx: #ececf6;
      --mut: #9a9ab3;
      --bd: #2c2c42;
      --acc: #8b7fff;
      --accs: #2a2750;
      --upc: #e0b020;
      --sh: 0 6px 24px rgba(0, 0, 0, .35);
      color-scheme: dark
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--tx);
      font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif
    }

    #app {
      display: flex;
      min-height: 100vh
    }

    #nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      background: var(--card);
      border-top: 1px solid var(--bd);
      padding: 4px 4px calc(4px + env(safe-area-inset-bottom, 0px));
      z-index: 5
    }

    .nv {
      flex: 1;
      background: none;
      border: 0;
      color: var(--mut);
      font: inherit;
      font-size: 11px;
      padding: 6px 2px;
      min-height: 48px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      cursor: pointer;
      border-radius: 12px
    }

    .nv span {
      font-size: 18px
    }

    .nv.on {
      color: var(--acc);
      font-weight: 600;
      background: var(--accs)
    }

    .nv.hm {
      display: none
    }

    #main {
      padding: 18px 16px 120px;
      max-width: 900px;
      margin: 0 auto;
      width: 100%
    }

    h1 {
      font-size: 26px;
      margin: 4px 0 2px;
      letter-spacing: -.02em
    }

    h2 {
      font-size: 17px;
      margin: 0 0 10px
    }

    .mut,
    small {
      color: var(--mut)
    }

    small {
      display: block;
      font-size: 12.5px
    }

    .card {
      background: var(--card);
      border: 1px solid var(--bd);
      border-radius: 18px;
      padding: 16px;
      margin: 14px 0;
      box-shadow: var(--sh)
    }

    .sec {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--mut);
      margin: 22px 0 6px;
      font-weight: 600
    }

    .clock {
      font-size: 40px;
      font-weight: 700;
      letter-spacing: -.03em;
      font-variant-numeric: tabular-nums
    }

    .now {
      display: flex;
      gap: 16px;
      align-items: center
    }

    .now .nt {
      flex: 1;
      min-width: 0
    }

    .now b {
      font-size: 20px
    }

    .ring {
      width: 72px;
      height: 72px;
      flex: none
    }

    .ring circle {
      fill: none;
      stroke-width: 7
    }

    .ring .bg {
      stroke: var(--bd)
    }

    .ring .fg {
      stroke: var(--acc);
      stroke-linecap: round;
      transform: rotate(-90deg);
      transform-origin: 50% 50%
    }

    .btn {
      background: var(--acc);
      color: #fff;
      border: 0;
      border-radius: 12px;
      padding: 11px 16px;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      min-height: 44px
    }

    .btn.g {
      background: var(--accs);
      color: var(--acc)
    }

    .btn.r {
      background: transparent;
      color: var(--emg);
      border: 1px solid var(--emg)
    }

    .btns {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 12px
    }

    input,
    select,
    textarea {
      width: 100%;
      font: inherit;
      color: var(--tx);
      background: var(--bg);
      border: 1px solid var(--bd);
      border-radius: 12px;
      padding: 11px 12px;
      min-height: 44px
    }

    textarea {
      min-height: 70px;
      resize: vertical
    }

    label {
      display: block;
      font-size: 12.5px;
      color: var(--mut);
      margin: 10px 0 4px
    }

    :focus-visible {
      outline: 3px solid var(--acc);
      outline-offset: 2px
    }

    .row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 4px;
      border-bottom: 1px solid var(--bd)
    }

    .row:last-child {
      border: 0
    }

    .row.dn .rt b {
      text-decoration: line-through;
      color: var(--done)
    }

    .rt {
      flex: 1;
      min-width: 0;
      cursor: pointer
    }

    .rt b {
      font-weight: 600;
      word-break: break-word
    }

    .ck {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 2px solid var(--bd);
      background: none;
      color: #fff;
      cursor: pointer;
      flex: none;
      font-size: 15px;
      position: relative
    }

    .ck::after {
      content: "";
      position: absolute;
      inset: -9px
    }

    .dn .ck {
      background: var(--done);
      border-color: var(--done)
    }

    .bd {
      font-size: 12px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 99px;
      white-space: nowrap;
      color: #fff
    }

    .bd.emg {
      background: var(--emg)
    }

    .bd.urg {
      background: var(--urg)
    }

    .bd.upc {
      background: var(--upc)
    }

    .bd.safe {
      background: var(--safe)
    }

    .bd.done {
      background: var(--done)
    }

    .chips {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin: 10px 0
    }

    .chip {
      border: 1px solid var(--bd);
      background: var(--card);
      border-radius: 99px;
      padding: 8px 14px;
      font: inherit;
      font-size: 13px;
      cursor: pointer;
      color: var(--tx);
      min-height: 40px
    }

    .chip.on {
      background: var(--acc);
      color: #fff;
      border-color: var(--acc)
    }

    .grid2 {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px
    }

    @media(min-width:700px) {
      .grid2 {
        grid-template-columns: 1fr 1fr
      }
    }

    .q {
      border-top: 5px solid var(--bd);
      margin: 0
    }

    .q.do {
      border-top-color: var(--emg)
    }

    .q.sch {
      border-top-color: var(--acc)
    }

    .q.del {
      border-top-color: var(--urg)
    }

    .q.eli {
      border-top-color: var(--done)
    }

    .blk {
      display: flex;
      gap: 14px;
      background: var(--card);
      border: 1px solid var(--bd);
      border-left: 5px solid var(--acc);
      border-radius: 14px;
      padding: 12px 14px;
      margin: 8px 0;
      cursor: pointer
    }

    .blk.brk {
      border-left-color: var(--safe)
    }

    .blk.cur {
      background: var(--accs);
      box-shadow: 0 0 0 2px var(--acc)
    }

    .bt {
      width: 78px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      flex: none
    }

    .bb {
      flex: 1;
      min-width: 0
    }

    .warn {
      color: var(--urg);
      font-weight: 600
    }

    .nowt {
      color: var(--acc);
      font-weight: 700
    }

    .empty {
      text-align: center;
      color: var(--mut);
      padding: 20px 8px
    }

    .days {
      display: grid;
      gap: 10px;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr))
    }

    .day {
      cursor: pointer;
      margin: 0
    }

    .day.t {
      box-shadow: 0 0 0 2px var(--acc)
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap
    }

    #fab {
      position: fixed;
      right: 16px;
      bottom: calc(78px + env(safe-area-inset-bottom, 0px));
      width: 56px;
      height: 56px;
      border-radius: 50%;
      font-size: 28px;
      border: 0;
      background: var(--acc);
      color: #fff;
      box-shadow: 0 8px 24px rgba(60, 40, 200, .4);
      cursor: pointer;
      z-index: 6
    }

    .ov {
      position: fixed;
      inset: 0;
      background: rgba(10, 10, 30, .5);
      z-index: 20;
      display: flex;
      align-items: flex-end;
      justify-content: center
    }

    .md {
      background: var(--card);
      width: 100%;
      max-width: 480px;
      max-height: 92vh;
      overflow: auto;
      border-radius: 22px 22px 0 0;
      padding: 20px;
      padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px))
    }

    @media(min-width:820px) {
      .ov {
        align-items: center
      }

      .md {
        border-radius: 22px
      }
    }

    .err {
      color: var(--emg);
      font-size: 13px;
      min-height: 18px;
      margin-top: 6px
    }

    #toast {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: calc(84px + env(safe-area-inset-bottom, 0px));
      background: #222;
      color: #fff;
      border-radius: 12px;
      padding: 10px 16px;
      z-index: 50;
      display: none;
      gap: 14px;
      align-items: center
    }

    #toast button {
      background: none;
      border: 0;
      color: #b9b3ff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      min-height: 36px
    }

    @media(min-width:820px) {
      #nav {
        position: sticky;
        top: 0;
        height: 100vh;
        width: 210px;
        flex-direction: column;
        border-top: 0;
        border-right: 1px solid var(--bd);
        padding: 20px 12px;
        flex: none;
        align-self: flex-start
      }

      .nv {
        flex: none;
        flex-direction: row;
        font-size: 15px;
        gap: 12px;
        padding: 10px 14px;
        justify-content: flex-start
      }

      .nv.hm {
        display: flex
      }

      #main {
        padding-bottom: 60px
      }

      #fab {
        bottom: 24px;
        right: 28px
      }

      #toast {
        bottom: 24px
      }
    }

    @media(prefers-reduced-motion:no-preference) {

      .card,
      .blk,
      .chip {
        transition: box-shadow .2s, background .2s
      }
    }

    .sm {
      background: var(--accs);
      border-radius: 14px;
      padding: 12px;
      margin: 2px 0 10px
    }

    .smh {
      display: flex;
      justify-content: space-between;
      align-items: center
    }

    .pb {
      height: 8px;
      background: var(--bd);
      border-radius: 9px;
      overflow: hidden;
      margin: 8px 0 4px
    }

    .pb i {
      display: block;
      height: 100%;
      background: var(--acc)
    }

    .g4 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-top: 10px
    }

    .g4 b {
      font-size: 14px
    }

    @media(min-width:600px) {
      .g4 {
        grid-template-columns: repeat(4, 1fr)
      }
    }

    details>summary {
      cursor: pointer;
      min-height: 40px;
      padding: 8px 0;
      color: var(--acc);
      font-weight: 600
    }

    #planbox {
      background: var(--accs);
      border-radius: 14px;
      padding: 4px 14px 10px;
      margin-top: 14px
    }

    #planbox ul,
    .sm ul {
      margin: 4px 0;
      padding-left: 18px
    }

    .dchips {
      display: flex;
      gap: 6px;
      flex-wrap: wrap
    }

    .dchips label {
      margin: 0;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 8px 10px;
      border: 1px solid var(--bd);
      border-radius: 99px;
      font-size: 13px;
      color: var(--tx);
      background: var(--card)
    }

    .dchips input {
      width: auto;
      min-height: 0
    }

    .pl {
      height: 2px;
      border-radius: 2px;
      background: var(--bd);
      margin-top: 10px
    }

    .pl i {
      display: block;
      height: 100%;
      border-radius: 2px;
      background: var(--c);
      box-shadow: 0 0 5px var(--c), 0 0 12px var(--c)
    }

    @media(prefers-reduced-motion:no-preference) {
      .pl i {
        transition: width .9s ease
      }
    }

    .pair {
      display: flex;
      gap: 8px
    }

    .pair>* {
      flex: 1
    }

    .sug {
      font-size: 18px;
      margin: 16px 0 2px
    }

    .lst {
      margin-top: 10px
    }

    .lst button {
      display: flex;
      justify-content: space-between;
      width: 100%;
      background: none;
      border: 0;
      border-bottom: 1px solid var(--bd);
      color: var(--tx);
      font: inherit;
      padding: 14px 2px;
      min-height: 48px;
      cursor: pointer;
      text-align: left
    }

    .lst button::after {
      content: "›";
      color: var(--mut)
    }

    .mo {
      margin-top: 12px
    }

    .mo>summary {
      font-weight: 500
    }

    .md {
      position: relative
    }

    .md h2 {
      padding-right: 46px
    }

    .kb {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 0;
      background: none;
      color: var(--mut);
      font-size: 24px;
      line-height: 1;
      cursor: pointer
    }

    .pop {
      position: absolute;
      top: 56px;
      right: 14px;
      background: var(--card);
      border: 1px solid var(--bd);
      border-radius: 14px;
      box-shadow: var(--sh);
      padding: 6px;
      z-index: 3;
      min-width: 200px
    }

    .pop button {
      display: block;
      width: 100%;
      text-align: left;
      background: none;
      border: 0;
      color: var(--tx);
      font: inherit;
      padding: 12px;
      min-height: 44px;
      border-radius: 10px;
      cursor: pointer
    }

    .pop .dng {
      color: var(--emg)
    }

    .big {
      width: 100%;
      min-height: 54px;
      font-size: 17px;
      border-radius: 16px
    }

    .acts {
      display: flex;
      gap: 10px;
      margin-top: 12px
    }

    .acts button {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      background: var(--accs);
      color: var(--acc);
      border: 0;
      border-radius: 18px;
      padding: 14px 4px;
      min-height: 70px;
      font: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer
    }

    .acts svg {
      width: 22px;
      height: 22px
    }

    .sheetov {
      z-index: 25
    }

    .grab {
      width: 38px;
      height: 4px;
      border-radius: 4px;
      background: var(--bd);
      margin: -6px auto 14px
    }

    @media(prefers-reduced-motion:no-preference) {
      .sheetov .md {
        animation: up .24s ease-out
      }

      @keyframes up {
        from {
          transform: translateY(28px);
          opacity: .3
        }

        to {
          transform: none;
          opacity: 1
        }
      }

      .acts button,
      .pop button {
        transition: background .15s
      }
    }

    #timer {
      position: fixed;
      inset: 0;
      z-index: 40;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 26px;
      padding: calc(24px + env(safe-area-inset-top, 0px)) 24px calc(24px + env(safe-area-inset-bottom, 0px));
      background: radial-gradient(120% 80% at 50% 28%, #2a2160 0%, #15122b 48%, #0d0c18 100%);
      color: #ececf6;
      --acc: #9b8cff;
      --mut: #a29fc4;
      --accs: rgba(155, 140, 255, .16)
    }

    .tm-name {
      font-size: 19px;
      font-weight: 600;
      text-align: center;
      max-width: 90%;
      overflow-wrap: anywhere
    }

    .tm-ring {
      position: relative;
      width: min(78vw, 320px);
      aspect-ratio: 1
    }

    .tm-ring svg {
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
      overflow: visible
    }

    .tb {
      fill: none;
      stroke: rgba(255, 255, 255, .08);
      stroke-width: 5
    }

    .tf {
      fill: none;
      stroke: var(--acc);
      stroke-width: 5;
      stroke-linecap: round;
      filter: drop-shadow(0 0 6px var(--acc)) drop-shadow(0 0 16px var(--acc))
    }

    .tm-time {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font-size: clamp(44px, 14vw, 64px);
      font-weight: 300;
      letter-spacing: -.02em;
      font-variant-numeric: tabular-nums
    }

    .tm-ctl {
      display: flex;
      align-items: center;
      gap: 12px
    }

    .tm-ctl button {
      background: var(--accs);
      color: #ececf6;
      border: 0;
      border-radius: 99px;
      padding: 12px 20px;
      min-height: 48px;
      font: inherit;
      cursor: pointer
    }

    .tm-ctl .tm-main {
      background: var(--acc);
      color: #12102a;
      font-weight: 700;
      padding: 14px 30px;
      min-height: 56px
    }

    .tm-adj {
      background: none;
      border: 0;
      color: var(--mut);
      font: inherit;
      font-size: 14px;
      min-height: 44px;
      cursor: pointer
    }

    .tm-pan {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 340px
    }

    .tm-pan button {
      background: var(--accs);
      color: #ececf6;
      border: 0;
      border-radius: 99px;
      padding: 10px 16px;
      min-height: 44px;
      font: inherit;
      cursor: pointer
    }

    @media(prefers-reduced-motion:no-preference) {
      .tf {
        transition: stroke-dashoffset .6s linear
      }

      @keyframes br {
        50% {
          filter: drop-shadow(0 0 4px var(--acc)) drop-shadow(0 0 11px var(--acc))
        }
      }

      .tm-run .tf {
        animation: br 4s ease-in-out infinite
      }
    }

    #pill {
      position: fixed;
      top: calc(8px + env(safe-area-inset-top, 0px));
      left: 50%;
      transform: translateX(-50%);
      z-index: 15;
      display: none;
      max-width: 86vw
    }

    #pill button {
      background: var(--acc);
      color: #fff;
      border: 0;
      border-radius: 99px;
      padding: 10px 18px;
      min-height: 44px;
      font: inherit;
      font-weight: 600;
      box-shadow: 0 0 14px var(--acc);
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 86vw
    }

    .pb2 {
      background: var(--accs);
      color: var(--acc);
      border: 0;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      cursor: pointer;
      flex: none
    }
  </style>
</head>

<body>
  <div id="app">
    <nav id="nav" aria-label="Main"></nav>
    <main id="main"></main>
  </div>
  <button id="fab" data-act="newtask" aria-label="Add task (N)">+</button>
  <div id="modal"></div>
  <div id="toast" role="status"></div>
  <div id="timer" role="dialog" aria-modal="true" aria-label="Focus timer"></div>
  <div id="pill"></div>
  <script id="engine">
    const pad = n => String(n).padStart(2, '0');
    const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
    const addDays = (s, n) => { const [a, b, c] = s.split('-').map(Number); return ymd(new Date(a, b - 1, c + n)) };
    const dayNum = s => { const [a, b, c] = s.split('-').map(Number); return Date.UTC(a, b - 1, c) / 864e5 };
    const mins = s => { const [h, m] = s.split(':').map(Number); return h * 60 + m };
    const at = (ds, hm, add = 0) => { const [a, b, c] = ds.split('-').map(Number), [h, m] = hm.split(':').map(Number); return new Date(a, b - 1, c, h, m + add) };
    const dmin = b => Math.round((new Date(b.endAt) - new Date(b.startAt)) / 6e4);

    function tickTimer() { const z = S.sess, tt = $('#tt'), tf = $('#tf'); if (!z || !tt) return; const left = z.plannedMs - sessMs(z); tt.textContent = clock(left); tf.style.strokeDashoffset = TC * Math.min(1, Math.max(0, 1 - left / z.plannedMs)) }
    function pillUpd() { const z = S.sess, e = $('#pill'); if (!z || tmr.open) { e.style.display = 'none'; return } const t = tById(z.taskId); e.style.display = 'block'; e.innerHTML = `<button data-act="topen" aria-label="Open focus timer">${esc(t ? t.title : 'Focus')} · ${clock(z.plannedMs - sessMs(z))}</button>` }
    async function wl() { try { const need = tmr.open && S.sess && S.sess.resumedAt; if (need && !wlk && navigator.wakeLock) { wlk = await navigator.wakeLock.request('screen'); wlk.addEventListener('release', () => { wlk = null }) } else if (!need && wlk) { await wlk.release(); wlk = null } } catch (e) { } }
    function setPlanned(m) { const z = S.sess, b = S.blocks.find(x => x.id === z.blockId); z.plannedMs = Math.max(Math.ceil(sessMs(z) / 6e4) + 1, m) * 6e4; if (b && b.adhoc) b.endAt = new Date(+new Date(b.startAt) + z.plannedMs).toISOString(); save(); renderTimer() }
    /* ---------- Actions ---------- */
    const ACT = {
      review(d) { reviewModal(d.id) }, logwork(d) { logModal('', d.t) }, blockdone(d) { logModal(d.id) },
      applyplan(d) { const t = tById(d.id), r = t && applyFor(t); if (!r) return; save(); closeSheet(); render(); if (curD) detailModal(curD); toast(r.ids.length + ' session(s) added to Focus') },
      focusnow(d) { startFocus({ taskId: d.id }) }, focustask(d) { startFocus({ taskId: d.id, min: +d.m || 0 }) }, startblock(d) { startFocus({ blockId: d.id }) },
      topen() { tmr.open = true; tmr.adj = false; renderTimer() }, tmin() { tmr.open = false; renderTimer() }, tclose() { tmr = { open: false, done: null, adj: false }; renderTimer() },
      tpause() { const z = S.sess; if (z.resumedAt) { z.elapsed += Date.now() - z.resumedAt; z.resumedAt = null } else z.resumedAt = Date.now(); save(); renderTimer(); render() },
      tadjust() { tmr.adj = !tmr.adj; renderTimer() }, tdur(d) { setPlanned(+d.v) }, tadj(d) { setPlanned(Math.round(S.sess.plannedMs / 6e4) + (+d.v)) },
      tstop() { const r = finishSession(false); tmr = { open: false, done: null, adj: false }; renderTimer(); render(); if (r && r.m >= 1) toast('Logged ' + r.m + ' min', r.undo); else toast('Session ended') },
      logsheet(d) { logSheet(d.id) }, schsheet(d) { schSheet(d.id) }, editsheet(d) { editSheet(d.id) }, qlog(d) { $('#lg').value = d.v }, closesheet(d, el, e) { if (e.target === el) closeSheet() },
      editall(d) { taskModal(d.id) }, donetask(d) { toggle(d.id); closeM() },
      more(d, el) { const o = $('.pop'); if (o) return o.remove(); const t = tById(d.id); $('.md').insertAdjacentHTML('beforeend', `<div class="pop" role="menu"><button role="menuitem" data-act="donetask" data-id="${d.id}">${t.status === 'done' ? 'Reopen task' : 'Mark complete'}</button><button role="menuitem" data-act="editall" data-id="${d.id}">More details…</button><button role="menuitem" class="dng" data-act="deltask" data-id="${d.id}">Delete task</button></div>`) },
      savepref(d) {
        const t = tById(d.id), days = [...document.querySelectorAll('.sp-d:checked')].map(x => +x.value), tg = $('#sp-t').value;
        if (!days.length) return merr('Pick at least one workday.'); if (tg && t.dueDate && tg > t.dueDate) return merr('Finish-by must be on or before the deadline.');
        t.plan = { ...t.plan, target: tg, days, start: $('#sp-s').value, sessionMin: +$('#sp-l').value, mode: $('#sp-o').value, stale: true }; t.updatedAt = nowIso(); save(); render(); schSheet(d.id)
      },
      saveedit(d) {
        const t = tById(d.id), title = $('#ed-t').value.trim(), due = $('#ed-d').value, v = (+$('#ed-h').value || 0) * 60 + (+$('#ed-m').value || 0);
        if (!title) return merr('Please enter a task name.'); if (v && !due) return merr('Set a deadline to plan the work.');
        const old = Math.round(prog(t) * 100), dc = due !== (t.dueDate || ''); t.title = title; t.dueDate = due;
        if (v || t.plan) { const o = t.plan || {}; t.plan = { ...DEFP, ...o, estMin: v, stale: !t.plan || !!o.stale || dc || o.estMin !== v }; if (t.plan.target && due && t.plan.target > due) t.plan.target = '' }
        t.updatedAt = nowIso(); let r = null; if (t.plan && t.plan.estMin > 0 && t.plan.mode === 'auto') { const c = planCalc(t, S.blocks, new Date()); if (c && !c.drop.length && !c.keep.length) r = applyFor(t) }
        save(); closeSheet(); render(); detailModal(d.id, old); if (r && r.ids.length) toast('Plan: ' + fmt(r.c.recMin) + ' a day · ' + r.ids.length + ' sessions in Focus', () => { S.blocks = S.blocks.filter(b => !r.ids.includes(b.id)); t.plan.stale = true; save(); render() })
      },
      savelog(d) {
        const m = Math.max(0, +$('#lg').value || 0), t = tById(d.t), b = d.b && S.blocks.find(x => x.id === d.b), old = Math.round(prog(t) * 100); if (b) { b.status = 'done'; b.workedMin = m }
        t.plan = t.plan || { ...DEFP }; t.plan.doneMin = (t.plan.doneMin || 0) + m; t.plan.stale = true; t.updatedAt = nowIso(); save(); closeM(); render(); if (!d.b) detailModal(d.t, old)
      },
      close(d, el, e) { if (e.target === el) closeM() }, newtask() { taskModal() }, newblock() { blockModal() }, editblock(d) { blockModal(d.id) }, prio(d) { prioModal(d.d) },
      savetask(d) {
        const title = $('#m-t').value.trim(); if (!title) return merr('Please enter a task title.');
        const f = { title, notes: $('#m-n').value, important: unt($('#m-i').value), urgent: unt($('#m-u').value), dueDate: $('#m-d').value, scheduledDate: $('#m-s').value };
        const old = d.id ? tById(d.id) : null, pl = readPlan(f.dueDate); if (pl && pl.err) return merr(pl.err);
        if (pl) { const o = old && old.plan || {}, key = x => JSON.stringify([x.estMin, x.target, x.days, x.start, x.sessionMin, x.mode]); f.plan = { ...DEFP, ...o, ...pl, stale: !!o.stale || key(o) !== key(pl) || (!!old && old.dueDate !== f.dueDate) } } else f.plan = null;
        if (d.id) { Object.assign(old, f, { updatedAt: nowIso() }); save(); closeM(); render() }
        else {
          const nt = addTask(f), r = nt.plan && nt.plan.mode === 'auto' ? applyFor(nt) : null; save(); closeM(); render();
          if (r && r.ids.length) toast('Plan: ' + fmt(r.c.recMin) + ' a day · ' + r.ids.length + ' sessions in Focus', () => { S.blocks = S.blocks.filter(b => !r.ids.includes(b.id)); nt.plan.stale = true; save(); render() })
        }
      },
      deltask(d, el) {
        if (!el.dataset.armed) { el.dataset.armed = 1; el.textContent = 'Tap again to confirm'; return }
        const t = tById(d.id); t.deletedAt = nowIso(); S.blocks = S.blocks.filter(b => b.taskId !== d.id); for (const k in S.prio) if (S.prio[k].taskId === d.id) delete S.prio[k]; save(); closeM(); render()
      },
      saveblock(d) {
        const type = $('#b-y').value, link = $('#b-l').value, title = $('#b-t').value.trim(), date = $('#b-d').value, st = $('#b-s').value;
        const dur = Math.max(15, Math.round((+$('#b-m').value || 15) / 15) * 15); if (!date) return merr('Choose a date.');
        let taskId = null, label = title;
        if (type === 'task') { if (link) taskId = link; else if (title) taskId = addTask({ title, scheduledDate: date }).id; else return merr('Choose an existing task or type a new title.') }
        else label = title || 'Break';
        const s = new Date(date + 'T' + st), e = new Date(+s + dur * 6e4);
        if (d.id) Object.assign(S.blocks.find(b => b.id === d.id), { type, taskId, title: label, startAt: s.toISOString(), endAt: e.toISOString(), auto: false, updatedAt: nowIso() });
        else S.blocks.push({ id: uid(), type, taskId, title: label, startAt: s.toISOString(), endAt: e.toISOString(), createdAt: nowIso(), updatedAt: nowIso() });
        fdate = date; save(); closeM(); render()
      },
      delblock(d) { S.blocks = S.blocks.filter(b => b.id !== d.id); if (S.sess && S.sess.blockId === d.id) S.sess = null; save(); closeM(); render() },
      saveprio(d) {
        let id = $('#p-t').value; const n = $('#p-n').value.trim(), a = $('#p-a').value, b = $('#p-b').value;
        if (!id) { if (!n) return merr('Choose a task or type a new one.'); id = addTask({ title: n, scheduledDate: d.d }).id }
        if ((a && !b) || (!a && b)) return merr('Set both focus start and end, or neither.');
        S.prio[d.d] = { id: S.prio[d.d]?.id || uid(), localDate: d.d, taskId: id, purpose: $('#p-w').value.trim(), start: a, end: b, status: $('#p-s').value }; save(); closeM(); render()
      },
      clearprio(d) { delete S.prio[d.d]; save(); closeM(); render() },
      sstart(d) { startFocus({ blockId: d.id }) },
      spause() { ACT.tpause() },
      sresume() { ACT.tpause() },
      send() { ACT.tstop() },
      fprev() { fdate = addDays(fdate, -1); render() }, fnext() { fdate = addDays(fdate, 1); render() }, ftoday() { fdate = today(); render() },
      wprev() { wk--; render() }, wnext() { wk++; render() }, wtoday() { wk = 0; render() },
      undo() { const f = undoFn; undoFn = null; $('#toast').style.display = 'none'; f && f() },
      copybk() { const t = $('#bk'); t.select(); try { navigator.clipboard.writeText(t.value) } catch (e) { } toast('Backup selected — copy it if not already copied') },
      restore() {
        try {
          const j = JSON.parse($('#rs').value); if (!j || !Array.isArray(j.tasks) || !Array.isArray(j.blocks)) throw 0;
          try { localStorage.setItem(K + '_prev', JSON.stringify(S)) } catch (e) { }
          S = { tasks: j.tasks, blocks: j.blocks, prio: j.prio || {}, set: { theme: 'auto', weekStart: 1, ...j.set }, sess: null }; save(); render(); toast('Restored. Previous data kept aside.')
        } catch (e) { $('#rerr').textContent = 'That does not look like a valid backup.' }
      },
      wipe(d, el) {
        if (!el.dataset.armed) { el.dataset.armed = 1; el.textContent = 'Tap again to delete everything'; return }
        try { localStorage.setItem(K + '_prev', JSON.stringify(S)) } catch (e) { } S = { tasks: [], blocks: [], prio: {}, set: { theme: 'auto', weekStart: 1 }, sess: null }; save(); render()
      }
    };
    function toast(m, u) { undoFn = u || null; const t = $('#toast'); t.innerHTML = esc(m) + (u ? '<button data-act="undo">Undo</button>' : ''); t.style.display = 'flex'; clearTimeout(tt); tt = setTimeout(() => t.style.display = 'none', 6000) }

    document.addEventListener('click', e => {
      if (!e.target.closest('.pop,.kb')) { const pp = $('.pop'); if (pp) pp.remove() }
      const el = e.target.closest('[data-nav],[data-tog],[data-edit],[data-open],[data-act],[data-f]'); if (!el) return; const d = el.dataset;
      if (d.nav) { view = d.nav; render(); scrollTo(0, 0) } else if (d.tog) toggle(d.tog); else if (d.edit) taskModal(d.edit); else if (d.open) detailModal(d.open);
      else if (d.f) { dlf = d.f; render() } else if (ACT[d.act]) ACT[d.act](d, el, e)
    });
    document.addEventListener('keydown', e => {
      const a = document.activeElement, typing = a && /INPUT|TEXTAREA|SELECT/.test(a.tagName);
      if (e.key === 'Escape') { if (tmr.open && S.sess) { tmr.open = false; renderTimer() } else if ($('.sheetov')) closeSheet(); else closeM() }
      if ((e.key === 'Enter' || e.key === ' ') && a && a.getAttribute('role') === 'button') { e.preventDefault(); a.click(); return }
      if (e.key === 'Enter' && a && /^(m-t|m-d|pl-h|pl-m)$/.test(a.id)) { const b = $('[data-act="savetask"]'); b && b.click(); return }
      if (e.key === 'Enter' && a && a.id === 'qa' && a.value.trim()) { addTask({ title: a.value.trim() }); save(); render(); toast('Task added'); return }
      if (typing || $('#modal').innerHTML || tmr.open || e.metaKey || e.ctrlKey) return;
      if (e.key === 'n') { e.preventDefault(); taskModal() }
      else if (e.key === '/') { e.preventDefault(); view = 'deadlines'; render(); $('#dq').focus() }
      else if (/^[1-6]$/.test(e.key)) { view = V[+e.key - 1][0]; render() }
    });
    document.addEventListener('input', e => { if (e.target.id === 'dq') { dlq = e.target.value; $('#dl').innerHTML = dlist() } });
    document.addEventListener('change', e => { const k = e.target.dataset.set; if (k) { S.set[k] = k === 'weekStart' ? +e.target.value : e.target.value; save(); render() } });

    function render() {
      const r = document.documentElement; S.set.theme === 'auto' ? r.removeAttribute('data-theme') : r.setAttribute('data-theme', S.set.theme);
      $('#nav').innerHTML = V.map(([k, l, i]) => `<button class="nv${k === view ? ' on' : ''}${k === 'one' ? ' hm' : ''}" data-nav="${k}" ${k === view ? 'aria-current="page"' : ''}><span aria-hidden="true">${i}</span>${l}</button>`).join('');
      $('#main').innerHTML = VIEWS[view](); lastNow = ''
    }
    /* live clock: real device time, no offsets; re-evaluates every second, on resume, and on date change */
    let lastMin = -1, lastDay = today(), lastNow = '';
    function tick() {
      checkDone(); if (S.sess) { tickTimer(); pillUpd() } const n = new Date(), c = $('#clk'); if (c) c.textContent = n.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', second: '2-digit' });
      const nc = $('#nowcard'); if (nc) { const h = nowCard(); if (h !== lastNow) { lastNow = h; nc.innerHTML = h } }
      const td = today(), idle = !$('#modal').innerHTML && !(document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName));
      if (td !== lastDay) { lastDay = td; if (idle) render() }
      else if (n.getMinutes() !== lastMin) { lastMin = n.getMinutes(); const sm = sweepMissed(S, n); if (sm) save(); if (idle && (sm || view === 'focus' || view === 'deadlines')) render() }
    }
    setInterval(tick, 1000);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) { checkDone(); tickTimer(); wl(); lastDay = today(); if (sweepMissed(S, new Date())) save(); if (!$('#modal').innerHTML) render() } });
    addEventListener('focus', () => { if (!$('#modal').innerHTML) render() });
    /* ---------- Cross-device sync: one private doc per person, last-write-wins ---------- */
    let ref = null, syncState = 'off', pushT, pushing = false, dirty = false;
    const SYNCL = { off: 'Sync: this device only (open the published page while signed in to sync)', ok: '✓ Synced across your devices', busy: 'Syncing…', err: '⚠ Sync problem — changes are still saved on this device' };
    function setSync(x) { syncState = x; const e = $('#syncs'); if (e) e.textContent = SYNCL[x] }
    function pushSoon() { if (!ref) return; setSync('busy'); clearTimeout(pushT); pushT = setTimeout(push, 800) }
    async function push() {
      if (pushing) { dirty = true; return } pushing = true;
      try { do { dirty = false; await ref.set({ json: JSON.stringify({ ...S, sess: null }), savedAt: S.savedAt || 0 }) } while (dirty); setSync('ok') } catch (e) { setSync('err') } pushing = false
    }
    function onRemote(snap) {
      const hasLocal = S.tasks.length || S.blocks.length || Object.keys(S.prio).length;
      if (!snap.exists) { if (hasLocal) { if (!S.savedAt) { S.savedAt = Date.now(); saveLocal() } push() } else setSync('ok'); return }
      const d = snap.data(), ra = +d.savedAt || 0, mine = S.savedAt || 0;
      if (ra > mine) {
        let r; try { r = JSON.parse(d.json) } catch (e) { return setSync('err') }
        if (!r || !Array.isArray(r.tasks)) return setSync('err');
        if (hasLocal) try { localStorage.setItem(K + '_prev', JSON.stringify(S)) } catch (e) { }
        S = { ...r, sess: S.sess, set: { weekStart: 1, ...r.set, theme: S.set.theme }, savedAt: ra }; saveLocal();
        const a = document.activeElement; if (!$('#modal').innerHTML && !(a && /INPUT|TEXTAREA|SELECT/.test(a.tagName))) render();
      } else if (ra < mine) return push();
      setSync('ok')
    }
    (async () => {
      try {
        if (typeof claude === 'undefined') return; const [db, u] = await Promise.all([claude.use('db'), claude.use('user')]); if (!db || !u) return;
        const id = await u.id(); if (!id) return; ref = db.doc('data/users/' + id + '/state'); setSync('busy'); ref.onSnapshot(onRemote, () => setSync('err'))
      } catch (e) { setSync('err') }
    })();
    addEventListener('online', () => { if (ref) pushSoon() });
    if (sweepMissed(S, new Date())) save();
    if (S.sess && !S.sess.plannedMs) { const b = S.blocks.find(x => x.id === S.sess.blockId); S.sess.plannedMs = (b ? dmin(b) : 25) * 6e4; S.sess.taskId = S.sess.taskId || (b && b.taskId) }
    checkDone();
    render(); renderTimer();
  </script>
