/* climber */
.jme{transition:transform 1s linear}.jmb{transform-box:fill-box;transform-origin:50% 100%}
.clsit,.armup{display:none}.cll{transform-box:fill-box;transform-origin:50% 8%}
.scene.run .cll.lf{animation:lgw .6s ease-in-out infinite alternate}.scene.run .cll.lb{animation:lgw .6s ease-in-out infinite alternate-reverse}
@keyframes lgw{from{transform:rotate(-30deg)}to{transform:rotate(30deg)}}
.scene.run .jmb{animation:wk .6s ease-in-out infinite}@keyframes wk{50%{transform:translateY(-1.6px)}}
.scene.brk .cll{display:none}.scene.brk .clsit{display:block}.scene.brk .clup{transform:translateY(4px)}.scene.brk .clpole{transform:translateX(3px)}
.scene.sum .armdn{display:none}.scene.sum .armup{display:block}.scene.sum .cll{animation:none}.scene.sum .jmb{animation:jmp .9s ease-in-out infinite}@keyframes jmp{50%{transform:translateY(-6px)}}

/* dragons */
.fd{transition:transform 1.6s ease-in-out}.fdb{animation:hov 2.6s ease-in-out infinite}.fd.f2 .fdb{animation-duration:3.1s;animation-delay:-1.2s}
@keyframes hov{50%{transform:translate(2px,-4px)}}
.fwf{transform-box:fill-box;transform-origin:85% 95%;animation:flp .5s ease-in-out infinite alternate}.fwb{transform-box:fill-box;transform-origin:85% 95%;animation:flp .5s ease-in-out -.25s infinite alternate}
@keyframes flp{from{transform:rotate(-20deg)}to{transform:rotate(16deg) scaleY(.8)}}
.scene.brk .fwf,.scene.brk .fwb{animation-duration:2.6s}.scene.brk .fdb,.scene.slp .fdb{animation-duration:5s}
.fdo{transform-box:fill-box;transform-origin:50% 50%}
.scene.cheer #fd1 .fdo,.rx-mile #fd1 .fdo{animation:lp 1.4s ease-in-out 1}.scene.cheer #fd2 .fdo,.rx-mile #fd2 .fdo{animation:lp 1.4s ease-in-out .25s 1}
@keyframes lp{to{transform:rotate(-360deg)}}
.scene.sum .fdo{animation:orb 5s ease-in-out infinite}.scene.sum #fd2 .fdo{animation-delay:-2.5s}
@keyframes orb{0%,100%{transform:translate(0,0)}25%{transform:translate(16px,-9px)}50%{transform:translate(0,-18px)}75%{transform:translate(-16px,-9px)}}

function onbRender(d){const c=$('#onbc');if(!c)return;const s=onb.step;
 c.innerHTML=`<div class="onbh"><div class="onbp" role="progressbar" aria-valuemin="1" aria-valuemax="3" aria-valuenow="${s+1}" aria-label="Step ${s+1} of 3">${[0,1,2].map(i=>`<i class="${i<s?'dn':i===s?'on':''}"></i>`).join('')}</div><small>Step ${s+1} of 3</small><button type="button" class="onbsk" data-onb="skip">Skip</button></div>
 <div class="onbb ${d>0?'fw':d<0?'bw':''}" id="onbb">${onbStep()}</div>

 if(s===1)onbUpd();if(s===2){onbPlace(onb.run==='done'?1:0);if(onb.run==='done')onbSummit(true)}

function onbUpd(){const A=onb.avail,r=onbFeas(A),M={on:['On track','ok','Plenty of room — you would finish before the deadline.'],risk:['At risk','warn','It fits, but only if everything goes to plan.'],no:['Not feasible','bad','Not enough time — you would be about '+fmt(r.short||60)+' short.']}[r.st]||['On track','ok',''],tk=ONB_T.find(x=>x.id===onb.pick)||ONB_T[0];

function onbRun(){if(onb.run||onb.slot===null)return;onb.run='going';const sc=$('#onbsc');sc&&sc.classList.add('run');const g=$('.onbgo');if(g){g.disabled=true;g.textContent='Focusing…'}
 const t0=performance.now(),D=RM()||matchMedia('(prefers-reduced-motion:reduce)').matches?1500:9000,hud=$('#onbhud');
