const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);
const nowIso=()=>new Date().toISOString();
const today=()=>ymd(new Date());
const daysLeft=s=>dayNum(s)-dayNum(today());
const tf=d=>d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
const hm=s=>{const[h,m]=s.split(':').map(Number);return tf(new Date(2000,0,1,h,m))};
const dlong=s=>new Date(s+'T00:00').toLocaleDateString([],{weekday:'long',month:'long',day:'numeric'});
const fd=s=>new Date(s+'T00:00').toLocaleDateString([],{month:'short',day:'numeric'}),fdt=d=>new Date(d).toLocaleString([],{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
const live=()=>S.tasks.filter(t=>!t.deletedAt),open=()=>live().filter(t=>t.status!=='done'&&t.status!=='archived');
const tById=id=>S.tasks.find(t=>t.id===id&&!t.deletedAt);
function addTask(o){const n=nowIso(),t={id:uid(),title:'',notes:'',status:'todo',important:null,urgent:null,dueDate:'',scheduledDate:'',createdAt:n,updatedAt:n,completedAt:null,deletedAt:null,...o};S.tasks.push(t);return t}
function sev(t){if(t.status==='done')return'done';if(!t.dueDate)return'none';const d=daysLeft(t.dueDate);return d<=0?'emg':d<=5?'urg':d<=9?'upc':'safe'}
function badge(t){const s=sev(t);if(s==='none')return'';const d=daysLeft(t.dueDate);
 return`<span class="bd ${s}">${s==='done'?'Done':d<0?(-d)+'d overdue':d===0?'Today':d===1?'Tomorrow':d+' days'}</span>`}
const quad=t=>t.important===null||t.urgent===null?'ns':t.important?(t.urgent?'do':'sch'):(t.urgent?'del':'eli');
function toggle(id){const t=tById(id);if(!t)return;const was=t.status==='done';t.status=was?'todo':'done';t.completedAt=was?null:nowIso();t.updatedAt=nowIso();save();render();if(!was)toast('Marked done',()=>toggle(id))}
const PAL=['#9b8cff','#4fd1c5','#f6ad55','#f687b3','#63b3ed','#9ae6b4','#fc8181','#d6bcfa'];
const hue=id=>PAL[[...String(id)].reduce((a,c)=>a+c.charCodeAt(0),0)%PAL.length];
const prog=t=>t.status==='done'?1:t.plan&&t.plan.estMin>0?Math.min(1,(t.plan.doneMin||0)/t.plan.estMin):0;
const pline=t=>`<div class="pl" style="--c:${hue(t.id)}" role="progressbar" aria-label="Progress" aria-valuenow="${Math.round(prog(t)*100)}" aria-valuemin="0" aria-valuemax="100"><i style="width:${prog(t)*100}%"></i></div>`;
const rowX=(t,ln,pl)=>{const nm=esc(t.title),dn=t.status==='done',ck=`<button class="ck" data-tog="${t.id}" aria-label="${dn?'Mark not done':'Mark done'}: ${nm}">${dn?'✓':''}</button>`;
 if(ln)return`<div class="row dcard s-${sev(t)}${dn?' dn':''}"><span class="ico" aria-hidden="true">${IC.book}</span><div class="rt" data-open="${t.id}" tabindex="0" role="button"><b>${nm}</b><div class="meta">${t.dueDate?`<small>${fd(t.dueDate)}</small>`:''}${badge(t)}</div>${pline(t)}</div>${ck}</div>`;
 return`<div class="row${dn?' dn':''}">${ck}<div class="rt" data-edit="${t.id}" tabindex="0" role="button"><b>${nm}</b>${t.notes?`<small>${esc(t.notes.slice(0,80))}</small>`:''}</div>${pl?`<button class="pb2" data-act="focustask" data-id="${t.id}" aria-label="Start focus: ${nm}">${PLAY}</button>`:''}${badge(t)}</div>`};
const row=t=>rowX(t,0);
const btitle=b=>b.type==='break'?(b.title||'Break'):(tById(b.taskId)?.title||b.title||'Task');
const opts=(a,sel)=>a.map(([v,l])=>`<option value="${esc(v)}"${String(v)===String(sel)?' selected':''}>${esc(l)}</option>`).join('');
const slots=[...Array(96)].map((_,i)=>{const v=pad(i>>2)+':'+pad(i%4*15);return[v,hm(v)]});
const tri=v=>v===null||v===undefined?'':v?'1':'0',unt=v=>v===''?null:v==='1';
const triOpts=v=>opts([['','Not set'],['1','Yes'],['0','No']],tri(v));

let curD=null,view='today',fdate=today(),wk=0,dlf='all',dlq='',undoFn=null,tt;
const svg=(d,z=20)=>`<svg viewBox="0 0 24 24" width="${z}" height="${z}" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const IC=Object.fromEntries(Object.entries({home:'<path d="M3 11l9-7 9 7v9a1 1 0 01-1 1h-5v-6h-6v6H4a1 1 0 01-1-1z"/>',timer:'<circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9.5 2.5h5"/>',cal:'<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/>',grid:'<rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/>',target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/>',dots:'<circle cx="5" cy="12" r="1.6" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><circle cx="19" cy="12" r="1.6" fill="currentColor"/>',book:'<path d="M4 4.5A1.5 1.5 0 015.5 3H20v15H5.5A1.5 1.5 0 004 19.5zM4 19.5A1.5 1.5 0 005.5 21H20"/>',cup:'<path d="M5 8h11v6a5 5 0 01-5 5h-1a5 5 0 01-5-5zM16 9h2a2 2 0 010 5h-2M8 3v2M12 3v2"/>',bolt:'<path d="M13 2L4 14h7l-1 8 9-12h-7z"/>',users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0113 0M16 4.5a3.5 3.5 0 010 7M18 14a6 6 0 013.5 6"/>',trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',search:'<circle cx="11" cy="11" r="6.5"/><path d="M16 16l5 5"/>',chev:'<path d="M9 5l7 7-7 7"/>',plus:'<path d="M12 5v14M5 12h14"/>',spark:'<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/>'}).map(([k,v])=>[k,svg(v)]));
const PLAY='<svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>';
const MARK=z=>`<svg viewBox="0 0 64 64" width="${z}" height="${z}" fill="none" stroke="currentColor" stroke-linecap="round" aria-hidden="true"><circle cx="32" cy="32" r="26" stroke-width="5"/><circle cx="32" cy="32" r="15" stroke-width="5"/><circle cx="32" cy="32" r="5" fill="currentColor" stroke="none"/></svg>`;
const BRAND=`<div class="brand"><span class="lg">${MARK(24)}</span><span><b>Focusy</b><small>Calm productivity, powerful progress.</small></span></div>`;
const emp=(ic,t,sub)=>`<div class="emp"><span>${ic}</span><b>${t}</b><small>${sub}</small></div>`;
const V=[['today','Today',IC.home],['focus','Focus',IC.timer],['deadlines','Deadlines',IC.cal],['matrix','Matrix',IC.grid],['one','One Thing',IC.target],['more','More',IC.dots]];

/* ---------- NOW card ---------- */
function curBlock(){const n=Date.now();return S.blocks.find(b=>+new Date(b.startAt)<=n&&n<+new Date(b.endAt))}
function sessMin(){const s=S.sess;if(!s)return 0;return Math.floor((s.elapsed+(s.resumedAt?Date.now()-s.resumedAt:0))/6e4)}
function nowCard(){
 const n=Date.now(),cur=curBlock(),nxt=S.blocks.filter(b=>+new Date(b.startAt)>n).sort((a,b)=>a.startAt<b.startAt?-1:1)[0];
 let h='';
 if(cur){const s=new Date(cur.startAt),e=new Date(cur.endAt),f=(n-s)/(e-s),C=2*Math.PI*30,left=Math.ceil((e-n)/6e4);
  h+=`<div class="now"><svg class="ring" viewBox="0 0 72 72" aria-hidden="true"><circle class="bg" cx="36" cy="36" r="30"/><circle class="fg" cx="36" cy="36" r="30" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-f)}"/></svg><div class="nt"><small class="nowt">NOW · ${tf(s)} – ${tf(e)}</small><b>${esc(btitle(cur))}</b><small>${left} min left · ends ${tf(e)}</small></div></div>`;
  if(!S.sess)h+=`<div class="btns"><button class="btn" data-act="sstart" data-id="${cur.id}">Start focus session</button></div>`;
 }else h+=`<div class="empty" style="padding:6px 0"><b>No task scheduled right now</b><br>${nxt?`Next: ${esc(btitle(nxt))} at ${tf(new Date(nxt.startAt))}`:'Add a block in Focus to plan your day.'}</div>`;
 if(cur&&nxt)h+=`<small style="margin-top:10px">Next: ${esc(btitle(nxt))} at ${tf(new Date(nxt.startAt))}</small>`;
 if(S.sess){const b=S.blocks.find(x=>x.id===S.sess.blockId);h+=`<div class="btns" style="align-items:center"><span><b>Focus session</b> · ${sessMin()} min${S.sess.resumedAt?'':' (paused)'}<small>${b?esc(btitle(b)):''}</small></span><button class="btn g" data-act="${S.sess.resumedAt?'spause':'sresume'}">${S.sess.resumedAt?'Pause':'Resume'}</button><button class="btn g" data-act="topen">Open</button><button class="btn r" data-act="send">End</button></div>`}
 return h}

/* ---------- Views ---------- */
const VIEWS={
today(){
 const d=new Date(),g=d.getHours()<12?'Good morning':d.getHours()<18?'Good afternoon':'Good evening',td=today(),p=S.prio[td],pt=p&&tById(p.taskId);
 const att=open().filter(t=>['emg','urg'].includes(sev(t))).sort((a,b)=>a.dueDate<b.dueDate?-1:1).slice(0,5);
 const sch=open().filter(t=>t.scheduledDate===td),nx=dayBlocks(td).filter(b=>b.type!=='break'&&b.status!=='done'&&b.status!=='missed'&&+new Date(b.endAt)>Date.now()).slice(0,3);
 const mins=pt?(Math.min(120,span(p.start,p.end))||recDur(pt)):25;
 return`<div class="top"><div><h1>${g}</h1><span class="mut">${dlong(td)}</span></div><div class="clock" id="clk">${d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit',second:'2-digit'})}</div></div>
 <div class="hero" aria-hidden="true"><span class="orb" data-lg>${LOGO(78)}</span></div><div class="hl">Today's Focus</div>
 <div class="card" id="nowcard">${nowCard()}</div>
 <div class="card day one" data-act="prio" data-d="${td}" tabindex="0" role="button"><span class="ico" aria-hidden="true">${IC.target}</span><div class="ob"><small class="lab">The One Thing</small>${p?oneBody(p):`<b>Choose today's One Thing</b><small>One priority, why it matters, and an optional protected focus block.</small>`}</div><span class="chev" aria-hidden="true">${IC.chev}</span></div>
 ${pt&&p.status!=='dn'?`<button class="btn big go" data-act="focustask" data-id="${pt.id}" data-m="${Math.min(120,span(p.start,p.end))||''}">${PLAY}Start Focus (${mins} min)</button>`:''}
 <input id="qa" placeholder="Quick add a task — press Enter" aria-label="Quick add a task" style="margin-top:14px">
 <div class="sech"><span>Next up</span><button class="lnk" data-nav="focus">See all</button></div>
 ${nx.length?`<div class="stack">${nx.map(b=>`<div class="nrow"><span class="ico" aria-hidden="true">${IC.book}</span><div class="rt" data-act="editblock" data-id="${b.id}" tabindex="0" role="button"><b>${esc(btitle(b))}</b><small>${tf(new Date(b.startAt))} – ${tf(new Date(b.endAt))}</small></div><button class="pb2" data-act="startblock" data-id="${b.id}" aria-label="Start focus: ${esc(btitle(b))}">${PLAY}</button></div>`).join('')}</div>`:`<div class="card">${emp(IC.cal,'Nothing planned next','Add a time block in Focus to shape your day.')}</div>`}
 <div class="sec">Needs attention</div><div class="card">${att.length?att.map(row).join(''):emp(IC.spark,'All clear','Nothing urgent right now.')}</div>
 <div class="sec">Scheduled today</div><div class="card">${sch.length?sch.map(row).join(''):'<div class="empty">No tasks scheduled for today.</div>'}</div>`},
focus(){
 const all=dayBlocks(fdate),tot=all.reduce((a,b)=>a+Math.round((new Date(b.endAt)-new Date(b.startAt))/6e4),0),dl=new Date(fdate+'T00:00').toLocaleDateString([],{weekday:'short',month:'short',day:'numeric'});
 return`<div class="top"><h1>Focus</h1><button class="btn" data-act="newblock">+ Add block</button></div>
 <div class="dnav"><button data-act="fprev" aria-label="Previous day">${svg(IC.chev.match(/<path[^>]*>/)[0].replace('M9 5l7 7-7 7','M15 5l-7 7 7 7'),18)}</button><button class="dpill" data-act="ftoday" aria-label="Jump to today">${fdate===today()?'Today · ':''}${dl}</button><button data-act="fnext" aria-label="Next day">${IC.chev}</button></div>
 <small>${all.length} blocks · ${Math.floor(tot/60)}h ${tot%60}m planned · 15-minute grid</small>
 ${all.length?`<div class="tl">${all.map(b=>bcard(b,all)).join('')}</div>`:`<div class="card">${emp(IC.timer,'No blocks yet','Add one to start your timeline.')}</div>`}`},
deadlines(){
 const L=open().filter(t=>t.dueDate),c={emg:0,urg:0,upc:0,safe:0};L.forEach(t=>c[sev(t)]++);
 const dn=live().filter(t=>t.status==='done'&&t.dueDate).length,col={emg:'var(--emg)',urg:'var(--urg)',upc:'var(--upc)',safe:'var(--safe)',done:'var(--done)'};
 const chip=(k,l,n)=>`<button class="chip${dlf===k?' on':''}" data-f="${k}">${col[k]?`<i class="dot" style="background:${col[k]}"></i>`:''}${l} <b>${n}</b></button>`;
 return`<div class="top"><h1>Deadlines</h1><button class="btn" data-act="newtask">+ Add</button></div>
 <div class="chips">${chip('all','All',L.length)}${chip('emg','Emergency',c.emg)}${chip('urg','Urgent',c.urg)}${chip('upc','Upcoming',c.upc)}${chip('safe','Safe',c.safe)}${chip('done','Done',dn)}</div>
 <div class="sf">${IC.search}<input id="dq" placeholder="Search deadlines ( / )" value="${esc(dlq)}" aria-label="Search deadlines"></div><div class="stack" id="dl">${dlist()}</div>
 <small style="margin-top:14px">Emergency: today/overdue · Urgent: 1–5 days · Upcoming: 6–9 days · Safe: 10+ days</small>`},
matrix(){
 const o=open(),Q={do:['Do','Important + urgent',IC.bolt],sch:['Schedule','Important, not urgent',IC.cal],del:['Delegate','Urgent, not important',IC.users],eli:['Eliminate','Neither',IC.trash]};
 const box=k=>{const l=o.filter(t=>quad(t)===k);return`<div class="card q ${k}"><div class="qh"><span class="ico" aria-hidden="true">${Q[k][2]}</span><div><h2>${Q[k][0]}</h2><small>${l.length} task${l.length===1?'':'s'}</small></div></div><small class="qs">${Q[k][1]}</small>${l.length?l.map(t=>rowX(t,0,1)).join(''):'<div class="qe">No tasks here.</div>'}<button class="addq" data-act="addq" data-q="${k}">${IC.plus} Add task</button></div>`};
 const ns=o.filter(t=>quad(t)==='ns');
 return`<div class="top"><h1>Matrix</h1><button class="btn" data-act="newtask">+ Add</button></div><small>Quadrants come only from Important and Urgent. Labels are suggestions — nothing is deleted or delegated for you.</small>
 <div class="qg" style="margin-top:12px">${box('do')}${box('sch')}${box('del')}${box('eli')}</div>
 <div class="card nsc"><h2>Not set <small style="display:inline">· needs classification</small></h2>${ns.length?ns.map(t=>rowX(t,0,1)).join(''):'<div class="empty">Everything is classified.</div>'}</div>`},
one(){
 const base=addDays(today(),wk*7),dow=new Date(base+'T00:00').getDay(),st=addDays(base,-((dow-S.set.weekStart+7)%7));
 const days=[...Array(7)].map((_,i)=>addDays(st,i));
 return`<div class="top"><h1>One Thing</h1><div class="btns" style="margin:0"><button class="btn g" data-act="wprev" aria-label="Previous week">‹</button><button class="btn g" data-act="wtoday">This week</button><button class="btn g" data-act="wnext" aria-label="Next week">›</button></div></div>
 <small>Pick one priority per day. A 4-hour protected block is a suggestion, not a rule.</small>

more(){
 const done=live().filter(t=>t.status==='done').sort((a,b)=>(b.completedAt||'')<(a.completedAt||'')?-1:1);
 return`<h1>More</h1>
 <div class="card day lnkrow" data-nav="one" tabindex="0" role="button"><span class="ico" aria-hidden="true">${IC.target}</span><div class="ob"><b>One Thing</b><small>Weekly planner for your daily priority</small></div><span class="chev" aria-hidden="true">${IC.chev}</span></div>
 <div class="card"><h2>Settings</h2><label for="s-th">Theme</label><select id="s-th" data-set="theme">${opts([['auto','Match device'],['light','Light'],['dark','Dark']],S.set.theme)}</select>
 <label for="s-ws">Start of week</label><select id="s-ws" data-set="weekStart">${opts([[1,'Monday'],[0,'Sunday']],S.set.weekStart)}</select>
 <label>Timezone</label><div>${esc(Intl.DateTimeFormat().resolvedOptions().timeZone)} <small style="display:inline">(from this device, DST-aware)</small></div></div>
 ${jnyCard()}${sndCard()}<div class="card"><h2>Status</h2><div>Storage: ${storeOK?'✓ saving locally in this browser':'⚠ cannot save — data will be lost on close'}</div><div id="syncs">${SYNCL[syncState]}</div><small>Notifications: not enabled yet.</small></div>
 <div class="card"><h2>History <small style="display:inline">· ${done.length} completed</small></h2>${done.length?done.map(row).join(''):'<div class="empty">Completed tasks appear here. Tap the circle to undo.</div>'}</div>
 <div class="card"><h2>Backup &amp; restore</h2><small>Copy this text and keep it somewhere safe.</small><textarea id="bk" readonly aria-label="Backup data">${esc(JSON.stringify(S))}</textarea>
 <div class="btns"><button class="btn g" data-act="copybk">Copy backup</button></div>
 <label for="rs">Restore from backup (current data is saved aside first). Restore and Delete all also reach your other devices</label><textarea id="rs" placeholder="Paste backup JSON"></textarea><div class="err" id="rerr"></div>
 <div class="btns"><button class="btn g" data-act="restore">Restore</button><button class="btn r" data-act="wipe">Delete all data</button></div></div>`}};
function oneBody(p){const t=tById(p.taskId),h=span(p.start,p.end)/60;
 return`<b>${esc(t?t.title:'(task removed)')}</b>${p.purpose?`<small>Why: ${esc(p.purpose)}</small>`:''}${p.start&&p.end?`<small>${hm(p.start)} – ${hm(p.end)} · ${+h.toFixed(1)}h</small>`:''}<small class="nowt">${{ns:'Not started',ip:'In progress',dn:'Done'}[p.status]||'Not started'}</small>`}
function dayBlocks(ds){const a=+new Date(ds+'T00:00'),b=+new Date(addDays(ds,1)+'T00:00');return S.blocks.filter(x=>+new Date(x.startAt)<b&&+new Date(x.endAt)>a).sort((p,q)=>p.startAt<q.startAt?-1:1)}
function bcard(b,all){const s=new Date(b.startAt),e=new Date(b.endAt),n=Date.now(),cur=+s<=n&&n<+e,
 ov=all.some(o=>o!==b&&+new Date(o.startAt)<+e&&+s<+new Date(o.endAt));
 return`<div class="blk${cur?' cur':''}${b.type==='break'?' brk':''}" data-act="editblock" data-id="${b.id}" tabindex="0" role="button"><div class="bt">${tf(s)}<small>${tf(e)}</small></div><div class="bc"><span class="bi" aria-hidden="true">${b.type==='break'?IC.cup:IC.book}</span><div class="bb"><b>${esc(btitle(b))}</b><small>${Math.round((e-s)/6e4)} min${ymd(e)!==ymd(s)?' · ends next day':''}${cur?' · <span class="nowt">NOW</span>':''}${ov?' · <span class="warn">⚠ overlaps another block</span>':''}${b.status==='done'?' · ✓ done'+(b.workedMin!==undefined?' ('+b.workedMin+' min)':''):''}${b.status==='missed'?' · <span class="warn">missed</span>':''}${b.auto?' · Smart':''}</small></div>${(()=>{const k=tById(b.taskId);return k&&k.plan&&k.plan.estMin&&b.type!=='break'&&b.status!=='done'?`<button class="btn g" style="min-height:40px;padding:6px 12px;align-self:center" data-act="blockdone" data-id="${b.id}">✓ Log</button>`:''})()}</div></div>`}
function dlist(){let L=live().filter(t=>t.dueDate);const q=dlq.toLowerCase();
 if(q)L=L.filter(t=>(t.title+' '+t.notes).toLowerCase().includes(q));
 L=L.filter(t=>dlf==='all'?t.status!=='done':sev(t)===dlf);
 L.sort((a,b)=>a.dueDate<b.dueDate?-1:a.dueDate>b.dueDate?1:0);
 return L.length?L.map(t=>rowX(t,1)).join(''):emp(IC.spark,'No deadlines here','Nothing matches this filter. Add a deadline with +.')}

/* ---------- Cross-device sync: one private doc per person, last-write-wins ---------- */
let ref=null,syncState='off',pushT,pushing=false,dirty=false;
const SYNCL={off:'Sync: this device only (open the published page while signed in to sync)',ok:'✓ Synced across your devices',busy:'Syncing…',err:'⚠ Sync problem — changes are still saved on this device'};
function setSync(x){syncState=x;const e=$('#syncs');if(e)e.textContent=SYNCL[x]}
function pushSoon(){if(!ref)return;setSync('busy');clearTimeout(pushT);pushT=setTimeout(push,800)}
async function push(){if(pushing){dirty=true;return}pushing=true;
 try{do{dirty=false;await ref.set({json:JSON.stringify({...S,sess:null}),savedAt:S.savedAt||0})}while(dirty);setSync('ok')}catch(e){setSync('err')}pushing=false}
function onRemote(snap){
 const hasLocal=S.tasks.length||S.blocks.length||Object.keys(S.prio).length;
 if(!snap.exists){if(hasLocal){if(!S.savedAt){S.savedAt=Date.now();saveLocal()}push()}else setSync('ok');return}
 const d=snap.data(),ra=+d.savedAt||0,mine=S.savedAt||0;
 if(ra>mine){let r;try{r=JSON.parse(d.json)}catch(e){return setSync('err')}
  if(!r||!Array.isArray(r.tasks))return setSync('err');
  if(hasLocal)try{localStorage.setItem(K+'_prev',JSON.stringify(S))}catch(e){}
  S={...r,sess:S.sess,set:{weekStart:1,...r.set,theme:S.set.theme,snd:S.set.snd,jny:S.set.jny},savedAt:ra};saveLocal();
  const a=document.activeElement;if(!$('#modal').innerHTML&&!(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)))render();
 }else if(ra<mine)return push();
 setSync('ok')}
